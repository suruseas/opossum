# Declarations that decide what a run means: an external volume (real name,
# never namespaced or seeded), a volume with a name of its own, a file secret
# and a file config, an internal network. The corpus had none of these; the
# config fixed-point gate and the load gate both run over this file.
name: decl
services:
  db:
    image: postgres:16
    volumes:
      - bare:/a
      - named:/b
      - ext:/c
    secrets:
      - pg_password
      - source: pg_password
        target: pw
    configs:
      - app_cf
      - source: app_cf
        target: /etc/app/cf.txt
    networks:
      - backend
volumes:
  bare:
  named:
    name: my-custom
  ext:
    external: true
secrets:
  pg_password:
    file: ./pg_password.txt
configs:
  app_cf:
    file: ./cf.txt
networks:
  backend:
    internal: true
