# Publish the documentation site.
#
# The site is generated from the repository's own markdown (internal/site says
# why it is generated rather than served from docs/ directly), so there is no
# second copy of the documentation to keep in step: change a page, and the site
# follows at the next release.
#
# It runs on a version tag, the same push that publishes the release and the
# Homebrew cask, so the site describes the version people can install. Run on
# every push to main, it published behaviour that had not been released yet.
# A run by hand deploys whatever ref it is given; give it the latest tag.
#
# It runs only on this repository, so a fork's tags deploy nothing.
name: pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Granted per job rather than to the whole workflow: the build reads the
# repository and writes an artifact, and only the deploy needs an identity token
# to prove to Pages which workflow it came from.
permissions:
  contents: read

# One deploy at a time, and let a run in progress finish: cancelling a deploy
# can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'suruseas/opossum'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The generator is tested (internal/site); running its tests here means a
      # broken site fails before it is published rather than after.
      - run: go test ./internal/site/
      - run: go run ./internal/site/build _site_src
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: _site_src
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: github.repository == 'suruseas/opossum'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
