name: ci

# Static checks + the fake-shim regression gate. These are cross-platform (the
# fake `container` shim is just Go + /bin/sh), so they run on Linux — fast and
# cheap. The real-`container` layer needs macOS 26 on Apple silicon with nested
# virtualization, which GitHub-hosted runners don't provide; that layer is
# verified on real hardware (see docs/real-runtime-review.md).
#
# Two jobs, one per compiler, so that they run side by side: two self-hosted
# runners on one machine take one each. This workflow used to be one job:
# Actions bills GitHub-hosted jobs separately, one-minute minimum, rounded
# up, and folded into one job the bill tracked the work. A self-hosted job
# is not billed by the minute, so the fold's reason is gone and its price is
# what is left: the two compilers waiting on each other. Measured: one job,
# 620 s; two jobs on one runner, 591 s (one after the other, 283 s and
# 301 s); two jobs on two runners, 425 s (side by side, 419 s and 382 s —
# each slower than alone, the two sharing one machine's CPU).
# Each job carries its own checkout and its own compiler; the pull-request
# gates (the changelog fragment, the released sections) and the
# release-config check ride with the go.mod compiler's job. Each job's gate
# runs with a temporary directory of the run's and the job's own (`TMPDIR`,
# on the gate steps): the leftovers check reads what a run left in that
# directory, and a directory shared with the other job would show it the
# other job's work in progress.
# Every push to a pull request runs it, drafted or not (and a reopened pull
# request runs again: with the ready mark no longer a trigger, reopening is
# a way to run the same head again without a push), and so does every push
# to main. It used to skip a draft's pushes and main's altogether: the
# runner was GitHub-hosted and billed by the minute, the account had 2,000
# free minutes a month, and a run took about six minutes in its last shape
# (one job; measured over 2026-09-01..05, the longest job 368 s) and longer
# in earlier ones — so a draft was left to the push-time sieve (`make
# sieve`, a fresh Linux container on the developer's own metal, run by the
# pre-push hook), marking it ready was the request for attestation, and
# main's tree, the squash of a head already attested, was not run. On the
# self-hosted runners none of that costs minutes, and what each run gives
# is worth having: a draft's run finds a broken shape while it is still
# being worked on, and main's run is a green about main's own tree, so a
# release cuts its tag over a run that already happened. A `[skip ci]` in a
# commit's message makes GitHub skip that push's run, on a pull request as
# on main (measured: a commit whose message merely mentioned the marker got
# no run); the squash commit's title is the pull request's title (or the
# one commit's, when the branch has only one) and its body is the branch's
# commit messages, one after the other (the repository's squash settings,
# `COMMIT_OR_PR_TITLE` and `COMMIT_MESSAGES`), so a marker in any commit on
# the branch reaches main — keep it out of the commits as well as the title
# and body.
# `workflow_dispatch` stays, for a run of main by hand. On a push to main the
# event carries no pull request, and the two pull-request gates below say so
# in their conditions and are skipped; a step that reads
# `github.event.pull_request` has to.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    # A self-hosted runner: the labels name the machine class, not a machine,
    # so a replacement with the same labels takes over without a change here.
    # release.yml (a darwin build) and pages.yml (the deploy permission) stay
    # on GitHub-hosted runners. The runner is expected to carry gcc (-race),
    # jq (go.mod version reads), make and git; the first step says which one
    # is missing rather than letting a later step fail on it obliquely — so
    # if the hosted image below turns out not to carry all four, that step
    # says which one, rather than a later step failing on it obliquely. No
    # run has happened on a hosted runner yet; the first one will say.
    # Where this runs depends on which copy of the repository it is. The
    # private repository is where the work happens and carries the two
    # self-hosted runners; the published copy, which each release overwrites
    # with this tree, has none — a job asking for those labels there waits
    # for a machine that will never take it and is cancelled unrun (24 hours
    # after one release's push, 21 minutes after another's), and an outside
    # contributor's pull request gets no answer either. GitHub-hosted runners
    # are free for a public repository and are GitHub's machines, not the
    # maintainer's, so the reason the work is kept off hosted runners here —
    # a contributor's code running on the maintainer's hardware — does not
    # apply there.
    #
    # The expression falls to `ubuntu-latest` when it cannot read the field,
    # which is the fallback that runs rather than the one that waits for a
    # runner that will never take it. What falls with it is the rest of the
    # switch: an unreadable field also turns the cache on and picks
    # `make test-shipped`, the narrower gate. The three triggers this
    # workflow has — pull_request, push and workflow_dispatch — all carry
    # `repository` in their payload, so the field is there to read; this says
    # where the expression lands if that ever stops being true, not that
    # landing there is as good.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    # The compiler each section installed is the compiler it uses. Left to
    # itself, go reads the `toolchain` line in go.mod and downloads a different
    # one — so the section set up with the version go.mod asks for would
    # quietly build with something else, and both sections could end up on the
    # same compiler while the log went on naming two.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changelog-fragment step three-dot diffs against
          # the PR base, and a shallow clone has no base to diff against.
          fetch-depth: 0
      - name: the runner has the tools the steps below assume
        run: |
          missing=""
          for tool in gcc jq make git; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing — install them on the runner host (apt-get install build-essential jq make git)"
            exit 1
          fi
          echo "runner: $(uname -srm), $(nproc) cpus, tmp=$(dirname "$(mktemp -u)")"

      # ---- the version go.mod asks for -----------------------------------
      #
      # Two compilers, because some of what this code reads — and writes —
      # changes between them. Coverage block boundaries moved between Go 1.26
      # and 1.27 and the mutation sweep answers differently on either side;
      # gofmt's own output changed too, and a shape both versions format the
      # same is the only shape that stays green here. The version go.mod asks
      # for is the floor the module claims to work on; stable is what people
      # who just installed Go will have.
      #
      # Two setup-go steps rather than one with the version computed: setup-go
      # takes the version and the file it reads it from as separate inputs, and
      # what it does when both are given, or when one is given empty, is not
      # something this should be relying on.
      # The cache follows the runner. By default the action saves GOMODCACHE
      # and GOCACHE to the Actions cache after the job (about 2.2 GB each,
      # some 9 minutes per step on this runner) and restores them before it.
      # On the self-hosted runner both directories are on the runner's own
      # disk and survive between jobs, so the save and the restore move data
      # the next run already has — 18 of a 23-minute run went to the two
      # uploads, and the repository's 10 GB cache quota was full of copies.
      # A GitHub-hosted runner is a fresh machine every time and keeps
      # nothing, so there the saved copy is the only one there is and the
      # reason for turning it off is gone. The runner reads the same field,
      # and a check holds both spellings so that one cannot be changed
      # without the other; what a hosted run actually costs with the cache
      # on is not measured here, and the published copy only picks this file
      # up at the next release. The check is in the same place as the one
      # holding `runs-on`, and it reads both jobs' lines.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ !github.event.repository.private }}
      # Not a formality. setup-go reads the `go` directive with a pattern of
      # its own that wants a literal space, so a tab or a leading space — both
      # of which the go tool accepts — leave it with nothing; and with nothing
      # it installs nothing, falls back to whatever Go the runner image happens
      # to carry, and says so in an info line rather than a warning. This
      # section would then be testing a version nobody chose, under the name of
      # the one it did.
      - name: this section runs the compiler go.mod asks for
        run: |
          go version
          want="$(go mod edit -json | jq -r '.Go // empty' | cut -d. -f1,2)"
          here="$(go version | awk '{print $3}' | sed 's/^go//' | cut -d. -f1,2)"
          echo "go.mod asks for $want; this section is running $here"
          if [ -z "$want" ] || [ -z "$here" ]; then
            echo "Could not read one of the two versions, so whether they agree is"
            echo "unknown — and unknown is not the same as fine."
            exit 1
          fi
          if [ "$want" != "$here" ]; then
            echo "This section exists to build with the version go.mod asks for, and"
            echo "it is running something else. The usual cause is setup-go failing"
            echo "to read the directive — it wants a literal space after \`go\`, where"
            echo "the go tool also takes a tab or a leading space — and quietly"
            echo "falling back to whatever Go the runner image carries."
            exit 1
          fi
      - name: gofmt (go.mod version)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (go.mod version)
        run: go vet ./...
      - name: build (go.mod version)
        run: go build ./...
      # The same command people run before pushing, not a restatement of it.
      # While this was written out twice, the two copies drifted apart in both
      # directions: the leftovers check guarded local runs only — and the runs
      # nobody watches are exactly where a leaked directory dies unseen — while
      # this line, without -count=1, could restore test results from a cache
      # frozen weeks earlier and report packages it never ran. One definition,
      # in the Makefile, and a check in internal/repohygiene that this file
      # still points at it — once per compiler, and at nothing else.
      #
      # A temporary directory of this run's and this job's own, so two jobs
      # running side by side on one machine do not read each other's
      # leftovers. Not the runner's `_work/_temp`: that is under the runner
      # user's home, and the suites refuse a state directory under the home
      # (they must never write to the real one). Made just before the gate
      # and removed after it, whatever the gate said.
      - name: a temporary directory of this job's own
        run: mkdir -p "/tmp/opossum-ci-${{ github.run_id }}-${{ github.job }}"
      # Which gate: the whole one where the workshop is, the product's
      # packages where only the product is. The published copy carries
      # neither the contributor guidance nor the changelog fragments, so the
      # checks that read them have nothing to check there — and a released
      # binary is what that copy is for. What `make test-shipped` runs is
      # pinned in the same check that pins `make test`: the set comes from
      # the compiler, so it follows the binary, and the line that asks for it
      # is held to the same flags.
      - name: test (go.mod version, the same gate as `make test`)
        env:
          TMPDIR: /tmp/opossum-ci-${{ github.run_id }}-${{ github.job }}
        run: ${{ github.event.repository.private && 'make test' || 'make test-shipped' }}
      - name: the temporary directory is removed
        if: ${{ always() }}
        run: rm -rf "/tmp/opossum-ci-${{ github.run_id }}-${{ github.job }}"

      # ---- a user-facing change carries a changelog fragment -------------
      #
      # Only on pull requests, where there is a base to diff against; only
      # about shipped code — tests, docs and the repo's own tooling don't need
      # an entry. Put `[skip changelog]` in the PR body for the rare shipped
      # change that genuinely has nothing to announce.
      # Only in the private repository, too: the published copy carries no
      # `changelog.d/` — the release that writes that copy has already folded
      # the fragments into a version's section — so an outside contributor's
      # pull request there would be asked for a file with nowhere to go. The
      # condition names the repository rather than the directory's absence,
      # so that a `changelog.d/` deleted by accident here still fails this
      # check loudly. `!= false` reads the same as the field itself for every
      # value this can be handed: the expression evaluator compares across
      # types by converting to a number, so a missing or null field is 0, as
      # `false` is, and `null != false` is false — the step is skipped, not
      # run (measured against the evaluator, not inferred). The longer
      # spelling is kept because it names the one value being tested for.
      - name: a shipped change needs a changelog.d fragment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.repository.private != false }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Three-dot: only what THIS branch changed. A two-dot diff also lists
          # everything main gained since the branch point — including other PRs'
          # fragments — so the check would pass for a branch that added none.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          added="$(git diff --name-only --diff-filter=A "$BASE...$HEAD")"
          # The exclusions are the two things a release note cannot be about.
          # `testdata/` by name: the Go toolchain never compiles a directory called
          # that, so nothing under it can reach a user — the fake `container` shims
          # live there and are not `_test.go` files. And the repo's own tooling,
          # named package by package: the changelog assembler and the tracked-file
          # ratchet run over this repository rather than shipping in the binary
          # (nothing under cmd/opossum imports repohygiene or claimcite at all;
          # `go list -deps ./cmd/... | grep claimcite` is empty, and the only file
          # importing it is its own test). Add to this list only after checking the
          # same way — that no product code imports it. The checking is not only
          # by hand: internal/repohygiene/gate_test.go pins the set of packages the
          # released binary links, so an exemption that becomes a lie fails there.
          shipped="$(echo "$changed" | grep -E '^(cmd|internal)/' | grep -v '_test\.go$' | grep -v '/testdata/' | grep -v '^cmd/changelog/' | grep -v '^internal/changelog/' | grep -v '^internal/repohygiene/' | grep -v '^internal/claimcite/' | grep -v '^cmd/mutate/' | grep -v '^internal/mutate/' | grep -v '^cmd/noleftovers/' | grep -v '^cmd/busy/' | grep -v '^internal/suitedir/' | grep -v '^internal/testpair/' | grep -v '^internal/site/' || true)"
          if [ -z "$shipped" ]; then
            echo "No shipped code changed — no fragment needed."; exit 0
          fi
          if echo "$BODY" | grep -qF '[skip changelog]'; then
            echo "PR body opts out with [skip changelog]."; exit 0
          fi
          # An ADDED file directly in changelog.d/ — not README.md, not a deletion,
          # and not a subdirectory (Load ignores those, so the entry would be
          # silently dropped from the release while every check passed).
          if echo "$added" | grep -qE '^changelog\.d/[^/]+\.md$' \
             && ! [ "$(echo "$added" | grep -E '^changelog\.d/[^/]+\.md$')" = "changelog.d/README.md" ]; then
            echo "Fragment present."; exit 0
          fi
          echo "This PR changes shipped code but adds no changelog.d/ fragment:"
          echo "$shipped" | sed 's/^/  /'
          echo
          echo "Add changelog.d/<number>-<slug>.<type>.md (see changelog.d/README.md),"
          echo "then run 'make changelog'. If the change truly needs no release note,"
          echo "put [skip changelog] in the PR body."
          # The opt-out written into a commit message instead of the body is a
          # mistake that has been made three times, and the refusal above reads
          # as "I did put it there". Name it — and say that editing the body is
          # not enough: no trigger above fires on an edit, and a re-run replays
          # the event as it was (GitHub's documented behaviour; nothing in this
          # repository can test it). The verdict does not change.
          if git log --format=%B "$BASE..$HEAD" | grep -qF '[skip changelog]'; then
            echo
            echo "Note: [skip changelog] is in a commit message, but this gate reads only the PR body."
            echo "Put it in the PR description and push again — editing the body alone does not re-run this check."
          fi
          exit 1

      # ---- the published record stays published ---------------------------
      #
      # A merge that resolves a CHANGELOG.md conflict by hand can drop or
      # rewrite a released `## [x.y.z]` section, or bring back a changelog.d
      # fragment the release already folded in — both went unnoticed once and
      # were caught by eye. The check reads what merging the PR would produce
      # (git merge-tree), not the head: a branch cut before a release lacks that
      # release's section without dropping anything. Against that merge: every
      # released section the base has is there, heading and text unchanged;
      # and no fragment it adds is an entry a released section of the base
      # already carries. Released sections are fixed outside pull requests, so
      # nothing here makes an exception.
      #
      # Every answer comes from git directly, never through a pipe whose status
      # is dropped (the step sets pipefail itself; steps run under `bash -e`
      # without it): a revision git cannot read, or a merge it cannot compute,
      # stops the check — unknown is not the same as fine.
      - name: released changelog sections stay released
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pipeline's status is its last command's: with pipefail a grep
          # that could not run on the left of a pipe fails the pipe too.
          set -o pipefail
          v="$(git version)"
          if ! [[ "$v" =~ ^git\ version\ ([0-9]+)\.([0-9]+) ]]; then
            echo "Cannot tell which git this runner has ($v); this check needs git 2.38 or later."
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" -lt 2 ] || { [ "${BASH_REMATCH[1]}" -eq 2 ] && [ "${BASH_REMATCH[2]}" -lt 38 ]; }; then
            echo "This runner has $v; computing a merge without a work tree (git merge-tree --write-tree) needs 2.38 or later."
            exit 1
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE:CHANGELOG.md" || ! git cat-file -e "$HEAD^{commit}"; then
            echo "Cannot read the base's CHANGELOG.md ('$BASE') or the head commit ('$HEAD'), so whether the"
            echo "released sections survive is unknown — and unknown is not the same as fine. The checkout"
            echo "needs the full history (fetch-depth: 0)."
            exit 1
          fi
          rc=0
          merge="$(git merge-tree --write-tree "$BASE" "$HEAD")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "This PR does not merge into its base cleanly (git merge-tree exit $rc), so what merging"
            echo "does to the released sections cannot be judged. Bring the branch up to date first:"
            echo "$merge" | sed 's/^/  /'
            exit 1
          fi
          tree="${merge%%$'\n'*}"
          # readlog REV:PATH prints the file with a heading line `## x` after
          # it: it keeps the file's last blank lines, which `$(...)` would drop,
          # and ends the last section the way a following heading would, so a
          # section appended after it does not change it; the heading is on a
          # line of its own whether or not the file ends in a newline. Read
          # from git directly, and returned on failure explicitly: `-e` does
          # not apply inside a command substitution, so without `|| return 1`
          # a failed `git show` would read as an empty file. The caller's
          # assignment then fails, and that ends the step.
          readlog() {
            local raw
            raw="$(git show "$1" && printf @)" || return 1
            raw="${raw%@}"
            case "$raw" in
              *$'\n') printf '%s## x' "$raw" ;;
              *) printf '%s\n## x' "$raw" ;;
            esac
          }
          base_log="$(readlog "$BASE:CHANGELOG.md")"
          merged_log=""
          if git cat-file -e "$tree:CHANGELOG.md" 2>/dev/null; then
            merged_log="$(readlog "$tree:CHANGELOG.md")"
          fi
          # The link reference definitions (`[x.y.z]: …`, at the end of the
          # file) are the released record too, but not the last section's text:
          # a release adds one for its version. Those of released versions are
          # compared on their own below — every one the base has must still be
          # there, as written; `[Unreleased]:` is rewritten by every release,
          # so only its presence is kept (a release rewrites it only when it is
          # there).
          # g is grep with "no match" (exit 1) as an answer and anything else
          # (exit 2: a failure) as a failure, so that a grep that could not run
          # never reads as "nothing there".
          g() { grep "$@" || [ $? -eq 1 ]; }
          # gq is grep -q for an `if` (not for `$(…)`, where its exit would end
          # a subshell only): "found" and "not found" are its two answers, and a
          # grep that could not run ends the step instead of reading as either.
          gq() { grep -q "$@"; local rc=$?; [ "$rc" -le 1 ] || exit 1; return "$rc"; }
          links() { g -E '^\[[^]]+\]: ' | g -v '^\[Unreleased\]: '; }
          nolinks() { g -vE '^\[[^]]+\]: '; }
          base_links="$(links <<<"$base_log")"
          base_text="$(nolinks <<<"$base_log")"
          merged_text="$(nolinks <<<"$merged_log")"
          # section HEADING prints that section of its input: the heading line
          # and every line up to the next `## ` heading. Its own trailing `x`
          # (a plain one, unlike readlog's heading) keeps the section's last
          # blank lines in the comparison.
          section() { awk -v h="$1" '$0 == h { on = 1; print; next } on && /^## / { exit } on { print }' || return 1; printf x; }
          heads="$(g -E '^## \[[0-9]' <<<"$base_text" | awk '!seen[$0]++')"
          lost="" changed="" twice="" linklost=""
          while IFS= read -r h; do
            [ -n "$h" ] || continue
            was="$(section "$h" <<<"$base_text")"
            now="$(section "$h" <<<"$merged_text")"
            nb="$(g -cxF -- "$h" <<<"$base_text")"
            n="$(g -cxF -- "$h" <<<"$merged_text")"
            if [ "$now" = "x" ]; then
              lost="$lost  $h"$'\n'
            elif [ "$n" -gt "$nb" ]; then
              twice="$twice  $h ($n times)"$'\n'
            elif [ "$nb" -gt 1 ]; then
              # The base itself has the heading more than once: nothing this
              # PR did, and nothing it can be asked to undo. Not compared.
              echo "The base has $h more than once ($nb times), so that section is not compared."
            elif [ "$was" != "$now" ]; then
              changed="$changed  $h"$'\n'
            fi
          done <<<"$heads"
          while IFS= read -r l; do
            [ -n "$l" ] || continue
            if ! gq -xF -- "$l" <<<"$merged_log"; then
              linklost="$linklost  $l"$'\n'
            fi
          done <<<"$base_links"
          if gq -E '^\[Unreleased\]: ' <<<"$base_log" && ! gq -E '^\[Unreleased\]: ' <<<"$merged_log"; then
            linklost="$linklost  [Unreleased]: (the line itself; its target is free to change)"$'\n'
          fi
          if [ -n "$lost$changed$twice$linklost" ]; then
            if [ -n "$lost" ]; then
              echo "Merging this PR drops released CHANGELOG.md sections the base has:"
              printf '%s' "$lost"
            fi
            if [ -n "$changed" ]; then
              echo "Merging this PR changes released CHANGELOG.md sections:"
              printf '%s' "$changed"
            fi
            if [ -n "$twice" ]; then
              echo "Merging this PR leaves a released CHANGELOG.md heading more than once, so its section cannot be compared:"
              printf '%s' "$twice"
            fi
            if [ -n "$linklost" ]; then
              echo "Merging this PR changes or drops link reference lines the base's CHANGELOG.md has (released versions', and the [Unreleased] line itself):"
              printf '%s' "$linklost"
            fi
            echo
            echo "Released sections are the published record and never change in a pull request. Take"
            echo "the base's CHANGELOG.md and run 'make changelog' instead of resolving the conflict by hand."
            exit 1
          fi
          # A fragment the merge adds whose entry the base's released sections
          # already carry: the release folded it in, and a merge put the file
          # back. The first line of the entry is enough to tell.
          released="$(sed -n '/^## \[[0-9]/,$p' <<<"$base_text")"
          # --no-renames: a merge that removes one fragment and adds another of
          # the same text would otherwise count as a rename, not an addition.
          # -z: names come NUL-separated and unquoted, whatever characters they
          # hold, and are read one at a time — not split into words or globbed.
          # Into a file first, so that a failed `git diff` ends the step (a
          # process substitution's status is never seen).
          names="$(mktemp "${TMPDIR:-/tmp}/released-gate.XXXXXX")"
          trap 'rm -f "$names"' EXIT
          git diff -z --name-only --no-renames --diff-filter=A "$BASE" "$tree" > "$names"
          while IFS= read -r -d '' f; do
            case "$f" in
              changelog.d/README.md) continue ;;
              changelog.d/*/*) continue ;;
              changelog.d/*.md) ;;
              *) continue ;;
            esac
            body="$(git show "$tree:$f")"
            first="$(g -m1 '^- ' <<<"$body")"
            if [ -n "$first" ] && gq -F -- "$first" <<<"$released"; then
              echo "This PR adds $f, but its entry is already in a released CHANGELOG.md section:"
              echo "  $first"
              echo
              echo "The release consumed that fragment; a merge brought the file back."
              echo "Remove it and run 'make changelog'."
              exit 1
            fi
          done < "$names"
          rm -f "$names"
          echo "Released sections intact; no consumed fragment came back."

      # ---- the release configuration still parses ------------------------
      - uses: goreleaser/goreleaser-action@v7
        if: ${{ !cancelled() }}
        with:
          install-only: true
          version: "~> v2"
      - name: validate .goreleaser.yaml
        if: ${{ !cancelled() }}
        # The Homebrew formula config is valid and releases fine; goreleaser only
        # flags it as using a soft-deprecated property. Keep the check visible but
        # don't fail CI on the deprecation notice.
        continue-on-error: true
        run: goreleaser check

  # The current release's compiler, in a job of its own (see the top of the
  # file): the same runner class, the same environment, its own checkout —
  # nothing here diffs against a base, so the default depth.
  stable:
    # The same switch as the job above, for the same reason.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - name: the runner has the tools the steps below assume
        run: |
          missing=""
          for tool in gcc jq make git; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing — install them on the runner host (apt-get install build-essential jq make git)"
            exit 1
          fi
          echo "runner: $(uname -srm), $(nproc) cpus, tmp=$(dirname "$(mktemp -u)")"

      # ---- the current release -------------------------------------------
      #
      # Its own job, so that it reports whatever the go.mod job did: "one
      # red, one green" says the two versions disagree, "both red" says the
      # change is broken. The gofmt divergence between 1.26 and 1.27 was
      # diagnosed from exactly that contrast. Within the job the steps stop
      # at the first red one, as the go.mod job's compiler steps do: what
      # the two compilers say of each other is the two jobs' doing, not a
      # step's. So a red tools check, or a go.mod floor that has caught up
      # with stable, leaves this job with no test answer at all — the
      # go.mod job's still stands, and that is the trade accepted here.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: ${{ !github.event.repository.private }}
      # When the two sections run the same compiler, everything they exist to
      # catch — coverage boundaries moving, gofmt changing its mind — cannot
      # show up in a green run. In the matrix this claim took two half-checks
      # in two jobs that could not see each other; here it is a single
      # comparison, made in this job from go.mod itself.
      - name: stable is a different compiler than go.mod asks for
        run: |
          # Read through the go tool, not with a pattern of our own: it accepts
          # a tab after the directive, and leading space before it, and a
          # pattern that misses those comes back empty — which would compare
          # equal to nothing and pass.
          go version
          floor="$(go mod edit -json | jq -r '.Go // empty' | cut -d. -f1,2)"
          here="$(go version | awk '{print $3}' | sed 's/^go//' | cut -d. -f1,2)"
          echo "go.mod asks for $floor; stable is $here"
          if [ -z "$floor" ] || [ -z "$here" ]; then
            echo "Could not read one of the two versions, so whether they differ is"
            echo "unknown — and unknown is not the same as fine."
            exit 1
          fi
          if [ "$floor" = "$here" ]; then
            echo "This job and the go.mod one (\`ci\`) are both Go $here, so the workflow is running"
            echo "the same compiler twice. The other job follows go.mod, so this means"
            echo "the version go.mod asks for has caught up with the current"
            echo "release: either give it a floor that is genuinely older, or drop"
            echo "this job and say here why it is no longer needed."
            exit 1
          fi
      - name: gofmt (stable)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (stable)
        run: go vet ./...
      - name: build (stable)
        run: go build ./...
      - name: a temporary directory of this job's own
        run: mkdir -p "/tmp/opossum-ci-${{ github.run_id }}-${{ github.job }}"
      - name: test (stable, the same gate as `make test`)
        env:
          TMPDIR: /tmp/opossum-ci-${{ github.run_id }}-${{ github.job }}
        run: ${{ github.event.repository.private && 'make test' || 'make test-shipped' }}
      - name: the temporary directory is removed
        if: ${{ always() }}
        run: rm -rf "/tmp/opossum-ci-${{ github.run_id }}-${{ github.job }}"
