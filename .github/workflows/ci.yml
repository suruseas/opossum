name: ci

# Static checks + the fake-shim regression gate. These are cross-platform (the
# fake `container` shim is just Go + /bin/sh), so they run on Linux — fast and
# cheap. The real-`container` layer needs macOS 26 on Apple silicon with nested
# virtualization, which GitHub-hosted runners don't provide; that layer is
# verified on real hardware (see docs/real-runtime-review.md).
#
# One job, on purpose. Actions bills each job separately, one-minute minimum,
# rounded up — split across four jobs this workflow did 216 seconds of work and
# billed seven minutes, two of them for six seconds of checks. Folded into one
# job the bill tracks the work. The cost is wall-clock (the two compilers used
# to run in parallel) and a single check mark on the PR — which failing step it
# was is in the step names.
# Pull requests: free while drafted, billed from the moment they claim to be
# ready — and following every push from then on. A reader stopped at an
# earlier version of this line ("and nowhere else") and read it as
# `synchronize` having been dropped; it is not, and the next paragraph is
# the part that says so.
# Of the two things this run used to provide, a clean machine is now the
# push-time sieve's job (`make sieve`, a fresh Linux container on the
# developer's own metal, run by the pre-push hook), and what cannot move
# there is the attestation: a green that someone other than whoever ran it
# can verify. The account has 2,000 free minutes a month; this file spends
# them on the one thing only it can do.
#
# Structurally free while drafted, structurally current once ready. Running
# on every push billed every review round — the measured median was two runs
# per pull request with a top of ten — so a draft's pushes cost nothing (the
# job skips them) and the local sieve owns that ground. Marking the request
# ready is the request for attestation, and from that moment `synchronize`
# runs again on each push: a green that stops following the head is a green
# about some other tree, which is the one thing attestation must never be.
# Push fixes as a draft; a push while ready spends a run to keep the
# attestation honest. No trigger for pushes to main: its tree is the squash
# of a head already attested. `workflow_dispatch` stays, for the one
# main-tree run a release cuts a tag over.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:

jobs:
  ci:
    # A draft is work still under the local sieve; marking it ready is the
    # request for attestation. `opened` fires for drafts too, and this is what
    # makes opening one free. On workflow_dispatch the event carries no
    # pull_request, the expression comes back empty, and !empty is true — the
    # manual main-tree run a release asks for goes ahead.
    if: ${{ !github.event.pull_request.draft }}
    # A self-hosted runner: the labels name the machine class, not a machine,
    # so a replacement with the same labels takes over without a change here.
    # release.yml (a darwin build) and pages.yml (the deploy permission) stay
    # on GitHub-hosted runners. The runner is expected to carry gcc (-race),
    # jq (go.mod version reads), make and git; the first step says which one
    # is missing rather than letting a later step fail on it obliquely.
    runs-on: [self-hosted, Linux, X64]
    # The compiler each section installed is the compiler it uses. Left to
    # itself, go reads the `toolchain` line in go.mod and downloads a different
    # one — so the section set up with the version go.mod asks for would
    # quietly build with something else, and both sections could end up on the
    # same compiler while the log went on naming two.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changelog-fragment step three-dot diffs against
          # the PR base, and a shallow clone has no base to diff against.
          fetch-depth: 0
      - name: the runner has the tools the steps below assume
        run: |
          missing=""
          for tool in gcc jq make git; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing — install them on the runner host (apt-get install build-essential jq make git)"
            exit 1
          fi
          echo "runner: $(uname -srm), $(nproc) cpus, tmp=$(dirname "$(mktemp -u)")"

      # ---- the version go.mod asks for -----------------------------------
      #
      # Two compilers, because some of what this code reads — and writes —
      # changes between them. Coverage block boundaries moved between Go 1.26
      # and 1.27 and the mutation sweep answers differently on either side;
      # gofmt's own output changed too, and a shape both versions format the
      # same is the only shape that stays green here. The version go.mod asks
      # for is the floor the module claims to work on; stable is what people
      # who just installed Go will have.
      #
      # Two setup-go steps rather than one with the version computed: setup-go
      # takes the version and the file it reads it from as separate inputs, and
      # what it does when both are given, or when one is given empty, is not
      # something this should be relying on.
      # `cache: false` on both setup-go steps: by default the action saves
      # GOMODCACHE and GOCACHE to the Actions cache after the job (about
      # 2.2 GB each, some 9 minutes per step on this runner) and restores
      # them before it. On the self-hosted runner both directories are on
      # the runner's own disk and survive between jobs, so the save and the
      # restore move data the next run already has — 18 of a 23-minute run
      # went to the two uploads, and the repository's 10 GB cache quota was
      # full of copies. On a fresh runner the first build compiles from
      # scratch, once.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Not a formality. setup-go reads the `go` directive with a pattern of
      # its own that wants a literal space, so a tab or a leading space — both
      # of which the go tool accepts — leave it with nothing; and with nothing
      # it installs nothing, falls back to whatever Go the runner image happens
      # to carry, and says so in an info line rather than a warning. This
      # section would then be testing a version nobody chose, under the name of
      # the one it did.
      - name: this section runs the compiler go.mod asks for
        run: |
          go version
          want="$(go mod edit -json | jq -r '.Go // empty' | cut -d. -f1,2)"
          here="$(go version | awk '{print $3}' | sed 's/^go//' | cut -d. -f1,2)"
          echo "go.mod asks for $want; this section is running $here"
          if [ -z "$want" ] || [ -z "$here" ]; then
            echo "Could not read one of the two versions, so whether they agree is"
            echo "unknown — and unknown is not the same as fine."
            exit 1
          fi
          if [ "$want" != "$here" ]; then
            echo "This section exists to build with the version go.mod asks for, and"
            echo "it is running something else. The usual cause is setup-go failing"
            echo "to read the directive — it wants a literal space after \`go\`, where"
            echo "the go tool also takes a tab or a leading space — and quietly"
            echo "falling back to whatever Go the runner image carries."
            exit 1
          fi
      - name: gofmt (go.mod version)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (go.mod version)
        run: go vet ./...
      - name: build (go.mod version)
        run: go build ./...
      # The same command people run before pushing, not a restatement of it.
      # While this was written out twice, the two copies drifted apart in both
      # directions: the leftovers check guarded local runs only — and the runs
      # nobody watches are exactly where a leaked directory dies unseen — while
      # this line, without -count=1, could restore test results from a cache
      # frozen weeks earlier and report packages it never ran. One definition,
      # in the Makefile, and a check in internal/repohygiene that this file
      # still points at it — once per compiler, and at nothing else.
      - name: test (go.mod version, the same gate as `make test`)
        run: make test

      # ---- the current release -------------------------------------------
      #
      # This section, and everything after it, runs even when the section
      # above failed. Folding the jobs was about the bill; whether both
      # compilers report is about information: "one red, one green" says the
      # two versions disagree, "both red" says the change is broken — and a
      # section that never ran turns that reading into "one red, one unknown".
      # The gofmt divergence between 1.26 and 1.27 was diagnosed from exactly
      # that contrast, the night before this file was folded.
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() }}
        with:
          go-version: stable
          cache: false
      # When the two sections run the same compiler, everything they exist to
      # catch — coverage boundaries moving, gofmt changing its mind — cannot
      # show up in a green run. In the matrix this claim took two half-checks
      # in two jobs that could not see each other; in one job it is a single
      # comparison.
      - name: stable is a different compiler than go.mod asks for
        if: ${{ !cancelled() }}
        run: |
          # Read through the go tool, not with a pattern of our own: it accepts
          # a tab after the directive, and leading space before it, and a
          # pattern that misses those comes back empty — which would compare
          # equal to nothing and pass.
          go version
          floor="$(go mod edit -json | jq -r '.Go // empty' | cut -d. -f1,2)"
          here="$(go version | awk '{print $3}' | sed 's/^go//' | cut -d. -f1,2)"
          echo "go.mod asks for $floor; stable is $here"
          if [ -z "$floor" ] || [ -z "$here" ]; then
            echo "Could not read one of the two versions, so whether they differ is"
            echo "unknown — and unknown is not the same as fine."
            exit 1
          fi
          if [ "$floor" = "$here" ]; then
            echo "Both sections of this job are Go $here, so it is running the same"
            echo "compiler twice. The older section follows go.mod, so this means"
            echo "the version go.mod asks for has caught up with the current"
            echo "release: either give it a floor that is genuinely older, or drop"
            echo "the second section and say here why it is no longer needed."
            exit 1
          fi
      - name: gofmt (stable)
        if: ${{ !cancelled() }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (stable)
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: build (stable)
        if: ${{ !cancelled() }}
        run: go build ./...
      - name: test (stable, the same gate as `make test`)
        if: ${{ !cancelled() }}
        run: make test

      # ---- a user-facing change carries a changelog fragment -------------
      #
      # Only on pull requests, where there is a base to diff against; only
      # about shipped code — tests, docs and the repo's own tooling don't need
      # an entry. Put `[skip changelog]` in the PR body for the rare shipped
      # change that genuinely has nothing to announce.
      - name: a shipped change needs a changelog.d fragment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Three-dot: only what THIS branch changed. A two-dot diff also lists
          # everything main gained since the branch point — including other PRs'
          # fragments — so the check would pass for a branch that added none.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          added="$(git diff --name-only --diff-filter=A "$BASE...$HEAD")"
          # The exclusions are the two things a release note cannot be about.
          # `testdata/` by name: the Go toolchain never compiles a directory called
          # that, so nothing under it can reach a user — the fake `container` shims
          # live there and are not `_test.go` files. And the repo's own tooling,
          # named package by package: the changelog assembler and the tracked-file
          # ratchet run over this repository rather than shipping in the binary
          # (nothing under cmd/opossum imports repohygiene or claimcite at all;
          # `go list -deps ./cmd/... | grep claimcite` is empty, and the only file
          # importing it is its own test). Add to this list only after checking the
          # same way — that no product code imports it. The checking is not only
          # by hand: internal/repohygiene/gate_test.go pins the set of packages the
          # released binary links, so an exemption that becomes a lie fails there.
          shipped="$(echo "$changed" | grep -E '^(cmd|internal)/' | grep -v '_test\.go$' | grep -v '/testdata/' | grep -v '^cmd/changelog/' | grep -v '^internal/changelog/' | grep -v '^internal/repohygiene/' | grep -v '^internal/claimcite/' | grep -v '^cmd/mutate/' | grep -v '^internal/mutate/' | grep -v '^cmd/noleftovers/' | grep -v '^cmd/busy/' | grep -v '^internal/suitedir/' | grep -v '^internal/site/' || true)"
          if [ -z "$shipped" ]; then
            echo "No shipped code changed — no fragment needed."; exit 0
          fi
          if echo "$BODY" | grep -qF '[skip changelog]'; then
            echo "PR body opts out with [skip changelog]."; exit 0
          fi
          # An ADDED file directly in changelog.d/ — not README.md, not a deletion,
          # and not a subdirectory (Load ignores those, so the entry would be
          # silently dropped from the release while every check passed).
          if echo "$added" | grep -qE '^changelog\.d/[^/]+\.md$' \
             && ! [ "$(echo "$added" | grep -E '^changelog\.d/[^/]+\.md$')" = "changelog.d/README.md" ]; then
            echo "Fragment present."; exit 0
          fi
          echo "This PR changes shipped code but adds no changelog.d/ fragment:"
          echo "$shipped" | sed 's/^/  /'
          echo
          echo "Add changelog.d/<number>-<slug>.<type>.md (see changelog.d/README.md),"
          echo "then run 'make changelog'. If the change truly needs no release note,"
          echo "put [skip changelog] in the PR body."
          exit 1

      # ---- the published record stays published ---------------------------
      #
      # A merge that resolves a CHANGELOG.md conflict by hand can drop a
      # released `## [x.y.z]` section, or bring back a changelog.d fragment the
      # release already folded in — both went unnoticed once and were caught by
      # eye. Two cheap checks against the base: every released heading it has,
      # the head keeps; and a fragment this branch adds is not an entry a
      # released section of the base already carries.
      - name: released changelog sections stay released
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base_heads="$(git show "$BASE:CHANGELOG.md" | grep -E '^## \[[0-9]' || true)"
          head_heads="$(git show "$HEAD:CHANGELOG.md" | grep -E '^## \[[0-9]' || true)"
          lost="$(comm -23 <(echo "$base_heads" | sort) <(echo "$head_heads" | sort))"
          if [ -n "$lost" ]; then
            echo "This PR drops released CHANGELOG.md sections the base has:"
            echo "$lost" | sed 's/^/  /'
            echo
            echo "Released sections are the published record and never change. Take"
            echo "the base's CHANGELOG.md and run 'make changelog' instead of resolving"
            echo "the conflict by hand."
            exit 1
          fi
          # A fragment added by this branch whose entry the base's released
          # sections already carry: the release folded it in, and a merge put
          # the file back. The first line of the entry is enough to tell.
          released="$(git show "$BASE:CHANGELOG.md" | sed -n '/^## \[[0-9]/,$p')"
          for f in $(git diff --name-only --diff-filter=A "$BASE...$HEAD" | grep -E '^changelog\.d/[^/]+\.md$' | grep -v '^changelog\.d/README\.md$' || true); do
            first="$(git show "$HEAD:$f" | grep -m1 '^- ' || true)"
            if [ -n "$first" ] && echo "$released" | grep -qF -- "$first"; then
              echo "This PR adds $f, but its entry is already in a released CHANGELOG.md section:"
              echo "  $first"
              echo
              echo "The release consumed that fragment; a merge brought the file back."
              echo "Remove it and run 'make changelog'."
              exit 1
            fi
          done
          echo "Released sections intact; no consumed fragment came back."

      # ---- the release configuration still parses ------------------------
      - uses: goreleaser/goreleaser-action@v7
        if: ${{ !cancelled() }}
        with:
          install-only: true
          version: "~> v2"
      - name: validate .goreleaser.yaml
        if: ${{ !cancelled() }}
        # The Homebrew formula config is valid and releases fine; goreleaser only
        # flags it as using a soft-deprecated property. Keep the check visible but
        # don't fail CI on the deprecation notice.
        continue-on-error: true
        run: goreleaser check
