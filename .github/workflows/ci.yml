name: ci

# Static checks + the fake-shim regression gate. These are cross-platform (the
# fake `container` shim is just Go + /bin/sh), so they run on Linux — fast and
# cheap. The real-`container` layer needs macOS 26 on Apple silicon with nested
# virtualization, which GitHub-hosted runners don't provide; that layer is
# verified on real hardware (see docs/real-runtime-review.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Two toolchains, because some of what this code reads changes between them.
  # Coverage is recorded per block, and which lines and columns a block spans is
  # the compiler's business: between Go 1.26 and 1.27 the block for a `case`
  # clause moved off the `case` line onto the one after it. Code that reads a
  # profile — the mutation sweep does, to say whether the tests reach a line —
  # answers differently on either side of that, and three such faults reached the
  # branch as "green here, red on CI" or, worse, as a wrong answer only CI ever
  # produced.
  #
  # `stable` alone left which compiler this runs on to the release schedule. The
  # version go.mod asks for is the floor the module claims to work on; stable is
  # what people who just installed Go will have. Running both means a difference
  # between them is a red build rather than something found later by whoever
  # happened to be on the other one.
  test:
    runs-on: ubuntu-latest
    # The compiler this job installed is the compiler it uses. Left to itself, go
    # reads the `toolchain` line in go.mod and downloads a different one — so the
    # lane set up with the version go.mod asks for would quietly build with
    # something else, and both lanes could end up on the same compiler while the
    # matrix went on reporting two green jobs.
    env:
      GOTOOLCHAIN: local
    strategy:
      # Both are reported. A failure on one is a real failure, and cancelling the
      # other would hide whether it is a difference between the two or a fault in
      # the code itself — which is the first thing anyone will want to know.
      fail-fast: false
      matrix:
        go: [gomod, stable]
    steps:
      - uses: actions/checkout@v4
      # Every lane has to be one this file knows how to set up and check. The two
      # below, and the two assertions further down, all name their lane as a
      # literal — so a lane added or renamed without touching them installs no
      # particular Go, runs on whatever the runner came with, and checks nothing,
      # while the other lane's assertion goes on passing. It would be green, and
      # it would be measuring one compiler twice.
      - name: this lane is one of the ones set up below
        if: matrix.go != 'gomod' && matrix.go != 'stable'
        run: |
          echo "No setup or check in this file matches the lane '${{ matrix.go }}',"
          echo "so it would run on whatever Go the runner happens to have and say"
          echo "nothing about it. Give it a setup step and a version assertion, or"
          echo "take it out of the matrix."
          exit 1
      # And there have to be two of them. The lane that says the two compilers
      # differ can only say it from the stable lane; drop that lane — an `exclude`
      # is enough — and the claim is never made by anybody, while what is left is
      # one green job on one compiler. Knowing that every lane present is a known
      # one says nothing about the ones that are missing.
      #
      # This counts lanes, not distinct lanes, and the difference is not academic:
      # `go: [gomod, gomod]` was tried here and produced two jobs, a job-total of
      # two, and a green run on a single compiler. Nothing below notices, because
      # every check is written for the lane it names and the missing one simply
      # never speaks. Closing that would take a guard that reads this file's own
      # matrix, which is a worse thing to depend on than the two names being
      # written once each. So it is said here instead: the lanes have to be two
      # different ones, and only a person reading this is checking that.
      - name: there are still two lanes
        run: |
          echo "this matrix has ${{ strategy.job-total }} lane(s)"
          if [ "${{ strategy.job-total }}" != "2" ]; then
            echo "This matrix exists to run the tests on two compilers and to say"
            echo "out loud that they are two. Both halves of that live in the lanes"
            echo "themselves, so a matrix of any other size leaves part of it"
            echo "unsaid. If a third compiler is worth testing, give it a setup"
            echo "step and a version assertion and change this number on purpose."
            exit 1
          fi
      # Two steps rather than one with the version computed: setup-go takes the
      # version and the file it reads it from as separate inputs, and what it does
      # when both are given, or when one is given empty, is not something this
      # should be relying on.
      - uses: actions/setup-go@v5
        if: matrix.go == 'gomod'
        with:
          go-version-file: go.mod
      - uses: actions/setup-go@v5
        if: matrix.go == 'stable'
        with:
          go-version: stable
      - name: which go
        run: go version
      # The whole point of the two lanes is that they are two compilers. When the
      # version go.mod asks for catches up with stable — it has been raised three
      # times already, once to get `go vet` to pass — they become the same one,
      # and the matrix goes on being green while protecting nothing. Nobody would
      # notice: two passing jobs look exactly like two passing jobs.
      # Two halves of one claim, each checked where it can be seen. Here: the
      # compiler this lane installed is the one go.mod asks for. Below, in the
      # other lane: what go.mod asks for is not the current release. Together they
      # say the two lanes are different compilers, without either job having to
      # learn what the other one got.
      #
      # This half is not a formality. setup-go reads the `go` directive with a
      # pattern of its own that wants a literal space, so a tab or a leading space
      # — both of which the go tool accepts — leave it with nothing; and with
      # nothing it installs nothing, falls back to whatever Go the runner image
      # happens to carry, and says so in an info line rather than a warning. That
      # lane would then be running a version it never claimed, under the name of
      # the one it did, with everything downstream looking right.
      - name: this lane is the compiler go.mod asks for
        if: matrix.go == 'gomod'
        run: |
          want="$(go mod edit -json | jq -r '.Go // empty' | cut -d. -f1,2)"
          here="$(go version | awk '{print $3}' | sed 's/^go//' | cut -d. -f1,2)"
          echo "go.mod asks for $want; this lane is running $here"
          if [ -z "$want" ] || [ -z "$here" ]; then
            echo "Could not read one of the two versions, so whether they agree is"
            echo "unknown — and unknown is not the same as fine."
            exit 1
          fi
          if [ "$want" != "$here" ]; then
            echo "This lane exists to build with the version go.mod asks for, and it"
            echo "is running something else. The usual cause is setup-go failing to"
            echo "read the directive — it wants a literal space after \`go\`, where the"
            echo "go tool also takes a tab or a leading space — and quietly falling"
            echo "back to whatever Go the runner image carries. This lane would then"
            echo "be testing a version nobody chose, under the name of one nobody ran."
            exit 1
          fi
      - name: the other lane is not this one
        if: matrix.go == 'stable'
        run: |
          # Read through the go tool, not with a pattern of our own: it accepts a
          # tab after the directive, and leading space before it, and a pattern
          # that misses those comes back empty — which would compare equal to
          # nothing and pass. Whatever cannot be read is a failure here, because
          # passing on an unread version is the shape of accident this step is for.
          floor="$(go mod edit -json | jq -r '.Go // empty' | cut -d. -f1,2)"
          here="$(go version | awk '{print $3}' | sed 's/^go//' | cut -d. -f1,2)"
          echo "go.mod asks for $floor; stable is $here"
          if [ -z "$floor" ] || [ -z "$here" ]; then
            echo "Could not read one of the two versions, so whether they differ is"
            echo "unknown — and unknown is not the same as fine."
            exit 1
          fi
          if [ "$floor" = "$here" ]; then
            echo "Both lanes of this matrix are Go $here, so it is running the same"
            echo "compiler twice. What it exists to catch — the coverage block"
            echo "boundaries moving between releases — cannot show up in a green run"
            echo "like this one. The older lane follows go.mod, so this means the"
            echo "version go.mod asks for has caught up with the current release:"
            echo "either give the matrix a floor that is genuinely older, or drop it"
            echo "and say here why it is no longer needed."
            exit 1
          fi
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + coverage)
        run: go test ./... -race -cover

  # A user-facing change without a changelog fragment is a release note that will
  # be missing. The check runs only on pull requests, where there is a base to
  # diff against, and only complains about changes to shipped code — tests, docs
  # and the repo's own tooling don't need an entry. Put `[skip changelog]` in the
  # PR body for the rare shipped change that genuinely has nothing to announce.
  changelog-fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a shipped change needs a changelog.d fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Three-dot: only what THIS branch changed. A two-dot diff also lists
          # everything main gained since the branch point — including other PRs'
          # fragments — so the check would pass for a branch that added none.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          added="$(git diff --name-only --diff-filter=A "$BASE...$HEAD")"
          # The exclusions are the two things a release note cannot be about.
          # `testdata/` by name: the Go toolchain never compiles a directory called
          # that, so nothing under it can reach a user — the fake `container` shims
          # live there and are not `_test.go` files. And the repo's own tooling,
          # named package by package: the changelog assembler and the tracked-file
          # ratchet run over this repository rather than shipping in the binary
          # (nothing under cmd/opossum imports repohygiene or claimcite at all;
          # `go list -deps ./cmd/... | grep claimcite` is empty, and the only file
          # importing it is its own test). Add to this list only after checking the
          # same way — that no product code imports it.
          shipped="$(echo "$changed" | grep -E '^(cmd|internal)/' | grep -v '_test\.go$' | grep -v '/testdata/' | grep -v '^cmd/changelog/' | grep -v '^internal/changelog/' | grep -v '^internal/repohygiene/' | grep -v '^internal/claimcite/' | grep -v '^cmd/mutate/' | grep -v '^internal/mutate/' || true)"
          if [ -z "$shipped" ]; then
            echo "No shipped code changed — no fragment needed."; exit 0
          fi
          if echo "$BODY" | grep -qF '[skip changelog]'; then
            echo "PR body opts out with [skip changelog]."; exit 0
          fi
          # An ADDED file directly in changelog.d/ — not README.md, not a deletion,
          # and not a subdirectory (Load ignores those, so the entry would be
          # silently dropped from the release while every check passed).
          if echo "$added" | grep -qE '^changelog\.d/[^/]+\.md$' \
             && ! [ "$(echo "$added" | grep -E '^changelog\.d/[^/]+\.md$')" = "changelog.d/README.md" ]; then
            echo "Fragment present."; exit 0
          fi
          echo "This PR changes shipped code but adds no changelog.d/ fragment:"
          echo "$shipped" | sed 's/^/  /'
          echo
          echo "Add changelog.d/<number>-<slug>.<type>.md (see changelog.d/README.md),"
          echo "then run 'make changelog'. If the change truly needs no release note,"
          echo "put [skip changelog] in the PR body."
          exit 1

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: "~> v2"
      - name: validate .goreleaser.yaml
        # The Homebrew formula config is valid and releases fine; goreleaser only
        # flags it as using a soft-deprecated property. Keep the check visible but
        # don't fail CI on the deprecation notice.
        continue-on-error: true
        run: goreleaser check
